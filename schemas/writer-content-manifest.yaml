$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://rapid-resume-system.local/schemas/writer-content-manifest.yaml"

title: "Writer Content Manifest"
description: >
  Semantic traceability artifact for a targeted resume. The Writer Content
  Manifest records how visible resume content relates to authorized analytical
  state, professional evidence, supported claims, functional-role presentation,
  terminology translation, presentation decisions, omissions, limitations,
  and validation results. It describes current presentation state and does not
  function as a revision log, workflow artifact, routing instruction, or
  corrective request.

type: object

additionalProperties: false

required:
  - schema_version
  - manifest_id
  - manifest_version
  - status
  - resume_reference
  - analysis_reference
  - content_entries
  - role_presentations
  - omitted_priority_evidence
  - presentation_decisions
  - limitations
  - lineage

properties:

  schema_version:
    type: string
    description: >
      Version of this schema against which the Writer Content Manifest
      was created.
    pattern: "^[0-9]+\\.[0-9]+$"
    examples:
      - "2.0"

  manifest_id:
    type: string
    description: >
      Stable human-readable identifier for this Writer Content Manifest.
      The identifier should remain stable across ordinary revisions associated
      with the same targeted resume.
    pattern: "^WCM-[0-9]{4,}$"
    examples:
      - "WCM-0001"

  manifest_version:
    type: integer
    minimum: 1
    description: >
      Monotonically increasing version number for this manifest.

  status:
    type: string
    description: >
      Lifecycle state of the manifest artifact. This does not represent runtime
      workflow state.
    enum:
      - active
      - superseded
      - deprecated

  resume_reference:
    $ref: "#/$defs/resume_reference"

  analysis_reference:
    $ref: "#/$defs/analysis_reference"

  content_entries:
    type: array
    minItems: 1
    description: >
      Individually addressable visible semantic units in the targeted resume.
      Material visible claims, bullets, headings, qualifications, and other
      evidence-bearing resume content should be represented here.
    items:
      $ref: "#/$defs/content_entry"

  role_presentations:
    type: array
    description: >
      Structured explanation of visible professional-role presentations,
      including supported functional roles, employment provenance, source roles,
      chronology treatment, and placement basis.
    items:
      $ref: "#/$defs/role_presentation"

  omitted_priority_evidence:
    type: array
    description: >
      Priority evidence identified by the Job Experience Analysis but
      intentionally omitted from the current resume.
    items:
      $ref: "#/$defs/omitted_priority_evidence"

  presentation_decisions:
    type: array
    description: >
      Material presentation judgments necessary to understand the current
      resume. This is not a revision log and should not record trivial stylistic
      decisions.
    items:
      $ref: "#/$defs/presentation_decision"

  limitations:
    type: array
    description: >
      Material evidence, analytical, structural, provenance, or presentation
      limitations visible during resume composition.
    items:
      $ref: "#/$defs/writer_limitation"

  lineage:
    $ref: "#/$defs/lineage"


$defs:

  resume_reference:
    type: object
    additionalProperties: false

    required:
      - resume_id
      - resume_version
      - target_job_id

    properties:

      resume_id:
        type: string
        pattern: "^RESUME-[0-9]{4,}$"
        description: >
          Stable identifier for the targeted resume represented by this manifest.

      resume_version:
        type: integer
        minimum: 1

      target_job_id:
        type: string
        minLength: 1

      resume_file_reference:
        type:
          - string
          - "null"
        description: >
          Stable file, document, or repository reference for the rendered or
          editable resume when available.

      resume_format:
        type:
          - string
          - "null"
        enum:
          - docx
          - pdf
          - markdown
          - plaintext
          - other
          - null


  analysis_reference:
    type: object
    additionalProperties: false

    required:
      - jea_id
      - analysis_version

    properties:

      jea_id:
        type: string
        pattern: "^JEA-[0-9]{4,}$"

      analysis_version:
        type: integer
        minimum: 1

      functional_role_ids:
        type: array
        uniqueItems: true
        description: >
          JEA functional-role architecture entries materially used in
          constructing this resume.
        items:
          type: string
          pattern: "^FRA-ROLE-[0-9]{3,}$"

      source_artifact_refs:
        type: array
        uniqueItems: true
        description: >
          Additional supplied professional artifacts materially used during
          presentation when useful for traceability.
        items:
          type: string


  content_entry:
    type: object
    additionalProperties: false

    required:
      - content_id
      - content_type
      - resume_location
      - final_text
      - requirement_ids
      - supported_claim_ids
      - evidence_mapping_ids
      - evidence_refs
      - functional_role_ids
      - composition
      - terminology
      - qualification_refs
      - caution_ids
      - limitation_ids
      - qualifications_preserved
      - validations
      - prohibited_claim_validation

    properties:

      content_id:
        type: string
        pattern: "^CONTENT-[0-9]{3,}$"
        description: >
          Human-readable content identifier local to this manifest.

      content_type:
        type: string
        enum:
          - summary_statement
          - role_heading
          - role_description
          - experience_bullet
          - skill
          - skill_group
          - certification
          - education
          - qualification
          - static_content
          - other

      resume_location:
        $ref: "#/$defs/resume_location"

      final_text:
        type: string
        minLength: 1
        description: >
          Exact visible resume text represented by this manifest entry.
          Storing final text enables direct semantic auditing against evidence.

      requirement_ids:
        type: array
        uniqueItems: true
        description: >
          Target-job requirements materially supported or addressed by this
          visible content.
        items:
          type: string
          pattern: "^REQ-[0-9]{3,}$"

      supported_claim_ids:
        type: array
        uniqueItems: true
        description: >
          Supported JEA claim IDs authorizing the professional interpretation
          expressed by this content.
        items:
          type: string
          pattern: "^CLAIM-[0-9]{3,}$"

      evidence_mapping_ids:
        type: array
        uniqueItems: true
        description: >
          JEA evidence-mapping relationships underlying this visible content.
        items:
          type: string
          pattern: "^MAP-[0-9]{3,}-[0-9]{2,}$"

      evidence_refs:
        type: array
        description: >
          Direct references to authoritative professional evidence underlying
          this visible content.
        items:
          $ref: "#/$defs/evidence_reference"

      functional_role_ids:
        type: array
        uniqueItems: true
        description: >
          JEA Functional Role Architecture entries represented by this content.
        items:
          type: string
          pattern: "^FRA-ROLE-[0-9]{3,}$"

      presentation_role_id:
        type:
          - string
          - "null"
        pattern: "^PROLE-[0-9]{3,}$"
        description: >
          Visible resume-role presentation under which this content appears,
          when applicable.

      composition:
        $ref: "#/$defs/composition"

      terminology:
        $ref: "#/$defs/terminology"

      qualification_refs:
        type: array
        uniqueItems: true
        description: >
          Structured references to qualifications or safe-claim constraints
          represented by the JEA when directly applicable.
        items:
          type: string

      caution_ids:
        type: array
        uniqueItems: true
        description: >
          JEA caution IDs materially relevant to this content.
        items:
          type: string
          pattern: "^CAUTION-[0-9]{3,}$"

      limitation_ids:
        type: array
        uniqueItems: true
        description: >
          JEA evidence-limitation IDs materially relevant to this content.
        items:
          type: string
          pattern: "^LIM-[0-9]{3,}$"

      qualifications_preserved:
        type: array
        description: >
          Material factual qualifications, caveats, or attribution limitations
          preserved in the visible presentation.
        items:
          type: string

      prohibited_claim_validation:
        $ref: "#/$defs/prohibited_claim_validation"

      validations:
        $ref: "#/$defs/content_validations"

      material_omissions:
        type: array
        description: >
          Relevant factual detail intentionally excluded from this visible
          content when the omission is material to understanding presentation
          choices.
        items:
          type: string

      notes:
        type:
          - string
          - "null"


  resume_location:
    type: object
    additionalProperties: false

    required:
      - section
      - ordinal

    properties:

      section:
        type: string
        enum:
          - header
          - professional_summary
          - core_competencies
          - skills
          - professional_experience
          - consulting_experience
          - education
          - certifications
          - additional_information
          - other

      section_label:
        type:
          - string
          - "null"
        description: >
          Visible section label when useful, especially when section is other.

      presentation_role_id:
        type:
          - string
          - "null"
        pattern: "^PROLE-[0-9]{3,}$"

      subsection:
        type:
          - string
          - "null"

      ordinal:
        type: integer
        minimum: 1
        description: >
          Relative visible order within the containing section or role.

      page:
        type:
          - integer
          - "null"
        minimum: 1
        description: >
          Rendered page number when known and stable enough to record.


  composition:
    type: object
    additionalProperties: false

    required:
      - type
      - component_evidence_refs
      - rationale

    properties:

      type:
        type: string
        enum:
          - direct_single
          - direct_composite
          - summarized_multiple
          - terminology_translation
          - static_content
          - other

      component_evidence_refs:
        type: array
        description: >
          Evidence components combined or summarized to construct this content.
          May be empty only for static content that does not make a professional
          evidence claim.
        items:
          $ref: "#/$defs/evidence_reference"

      rationale:
        type:
          - string
          - "null"
        description: >
          Why the evidence was combined, summarized, or translated in this way.

      composition_preserves_single_function:
        type:
          - boolean
          - "null"
        description: >
          Whether combined evidence remains within one coherent professional
          function. Useful when multiple evidence points are composed into a
          single visible bullet.


  terminology:
    type: object
    additionalProperties: false

    required:
      - translations

    properties:

      translations:
        type: array
        description: >
          Material terminology translations used to convert source terminology
          into accurate civilian, plain-language, or target-relevant language.
        items:
          $ref: "#/$defs/terminology_translation"


  terminology_translation:
    type: object
    additionalProperties: false

    required:
      - source_term
      - presented_term
      - translation_type
      - basis

    properties:

      source_term:
        type: string
        minLength: 1

      presented_term:
        type: string
        minLength: 1

      translation_type:
        type: string
        enum:
          - civilian_equivalent
          - acronym_expansion
          - target_terminology
          - plain_language
          - functional_role_translation
          - other

      basis:
        type: string
        minLength: 1
        description: >
          Analytical or evidentiary basis supporting the translation.

      functional_role_id:
        type:
          - string
          - "null"
        pattern: "^FRA-ROLE-[0-9]{3,}$"


  prohibited_claim_validation:
    type: object
    additionalProperties: false

    required:
      - checked_claim_ids
      - violations

    properties:

      checked_claim_ids:
        type: array
        uniqueItems: true
        description: >
          JEA prohibited-claim IDs materially relevant to this content that were
          considered during validation.
        items:
          type: string
          pattern: "^PCLAIM-[0-9]{3,}$"

      violations:
        type: array
        description: >
          Prohibited claims violated by the visible content. Writer-generated
          final content should normally contain no violations, but the schema
          permits failures so externally modified or invalid products can be
          audited faithfully.
        items:
          $ref: "#/$defs/prohibited_claim_violation"


  prohibited_claim_violation:
    type: object
    additionalProperties: false

    required:
      - prohibited_claim_id
      - description

    properties:

      prohibited_claim_id:
        type: string
        pattern: "^PCLAIM-[0-9]{3,}$"

      description:
        type: string
        minLength: 1


  content_validations:
    type: object
    additionalProperties: false

    required:
      - factual_support
      - ownership
      - scope
      - attribution
      - employer_provenance
      - chronology
      - prohibited_claims
      - qualification_preservation

    properties:

      factual_support:
        $ref: "#/$defs/validation_result"

      ownership:
        $ref: "#/$defs/validation_result"

      scope:
        $ref: "#/$defs/validation_result"

      attribution:
        $ref: "#/$defs/validation_result"

      employer_provenance:
        $ref: "#/$defs/validation_result"

      chronology:
        $ref: "#/$defs/validation_result"

      prohibited_claims:
        $ref: "#/$defs/validation_result"

      qualification_preservation:
        $ref: "#/$defs/validation_result"

      terminology_accuracy:
        oneOf:
          - $ref: "#/$defs/validation_result"
          - type: "null"


  validation_result:
    type: object
    additionalProperties: false

    required:
      - status

    properties:

      status:
        type: string
        enum:
          - passed
          - passed_with_qualification
          - not_applicable
          - failed

      qualification:
        type:
          - string
          - "null"
        description: >
          Required explanation when validation passes only with qualification or
          fails.

      related_evidence_refs:
        type: array
        items:
          $ref: "#/$defs/evidence_reference"


  role_presentation:
    type: object
    additionalProperties: false

    required:
      - presentation_role_id
      - visible_label
      - employment_envelope
      - source_role_ids
      - functional_role_ids
      - evidence_refs
      - presentation_basis
      - provenance_validation
      - chronology_validation

    properties:

      presentation_role_id:
        type: string
        pattern: "^PROLE-[0-9]{3,}$"

      visible_label:
        type: string
        minLength: 1
        description: >
          Visible professional role label used in the targeted resume.

      employment_envelope:
        $ref: "#/$defs/employment_envelope"

      source_role_ids:
        type: array
        uniqueItems: true
        description: >
          Historical source-role IDs represented within this visible functional
          role presentation.
        items:
          type: string
          pattern: "^ROLE-[0-9]{4,}$"

      functional_role_ids:
        type: array
        minItems: 1
        uniqueItems: true
        description: >
          JEA Functional Role Architecture entries supporting this visible
          presentation.
        items:
          type: string
          pattern: "^FRA-ROLE-[0-9]{3,}$"

      evidence_refs:
        type: array
        description: >
          Authoritative evidence presented beneath or materially supporting this
          visible role.
        items:
          $ref: "#/$defs/evidence_reference"

      content_ids:
        type: array
        uniqueItems: true
        description: >
          Visible content entries located beneath or materially associated with
          this role presentation.
        items:
          type: string
          pattern: "^CONTENT-[0-9]{3,}$"

      presentation_basis:
        type: string
        minLength: 1
        description: >
          Why this functional role presentation accurately communicates the
          authorized evidence.

      chronology_note:
        type:
          - string
          - "null"
        description: >
          Material explanation of simultaneity, consolidation, or chronology
          treatment where needed to prevent false interpretation.

      provenance_note:
        type:
          - string
          - "null"

      provenance_validation:
        $ref: "#/$defs/validation_result"

      chronology_validation:
        $ref: "#/$defs/validation_result"

      functional_role_validation:
        oneOf:
          - $ref: "#/$defs/validation_result"
          - type: "null"


  employment_envelope:
    type: object
    additionalProperties: false

    required:
      - employer
      - overall_start_date
      - overall_end_date

    properties:

      employer:
        type: string
        minLength: 1

      location:
        type:
          - string
          - "null"

      employment_type:
        type:
          - string
          - "null"

      overall_start_date:
        $ref: "#/$defs/partial_date"

      overall_end_date:
        oneOf:
          - $ref: "#/$defs/partial_date"
          - type: string
            const: present

      displayed_date_text:
        type:
          - string
          - "null"
        description: >
          Exact visible employment-date text used in the resume when useful for
          comparison with factual provenance.


  omitted_priority_evidence:
    type: object
    additionalProperties: false

    required:
      - omission_id
      - priority_evidence_id
      - reason_type
      - reason
      - requirement_ids
      - material_impact

    properties:

      omission_id:
        type: string
        pattern: "^OMIT-[0-9]{3,}$"

      priority_evidence_id:
        type: string
        pattern: "^PE-[0-9]{3,}$"

      reason_type:
        type: string
        enum:
          - space
          - redundancy
          - lower_relevance
          - narrative_coherence
          - seniority_control
          - scope_control
          - structural_constraint
          - superseded_by_stronger_evidence
          - other

      reason:
        type: string
        minLength: 1

      requirement_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^REQ-[0-9]{3,}$"

      material_impact:
        type: string
        enum:
          - none
          - low
          - moderate
          - high
        description: >
          Estimated impact of omitting this priority evidence on visible target
          alignment or differentiation.

      substitute_content_ids:
        type: array
        uniqueItems: true
        description: >
          Content entries providing alternative coverage when applicable.
        items:
          type: string
          pattern: "^CONTENT-[0-9]{3,}$"


  presentation_decision:
    type: object
    additionalProperties: false

    required:
      - decision_id
      - decision_type
      - description
      - rationale
      - related_content_ids
      - related_requirement_ids

    properties:

      decision_id:
        type: string
        pattern: "^PDEC-[0-9]{3,}$"

      decision_type:
        type: string
        enum:
          - functional_role_translation
          - evidence_consolidation
          - evidence_omission
          - seniority_control
          - scope_control
          - terminology_normalization
          - section_allocation
          - chronology_presentation
          - structural_compression
          - target_identity_emphasis
          - other

      description:
        type: string
        minLength: 1
        description: >
          Material presentation choice reflected in the current resume.

      rationale:
        type: string
        minLength: 1

      related_content_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^CONTENT-[0-9]{3,}$"

      related_requirement_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^REQ-[0-9]{3,}$"

      related_functional_role_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^FRA-ROLE-[0-9]{3,}$"

      related_evidence_refs:
        type: array
        items:
          $ref: "#/$defs/evidence_reference"


  writer_limitation:
    type: object
    additionalProperties: false

    required:
      - limitation_id
      - limitation_type
      - description
      - related_content_ids
      - related_requirement_ids
      - source_limitation_ids
      - presentation_impact

    properties:

      limitation_id:
        type: string
        pattern: "^WLIM-[0-9]{3,}$"

      limitation_type:
        type: string
        enum:
          - evidence
          - analysis
          - factual_ambiguity
          - structural
          - space
          - chronology
          - provenance
          - functional_role
          - terminology
          - other

      description:
        type: string
        minLength: 1

      related_content_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^CONTENT-[0-9]{3,}$"

      related_requirement_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^REQ-[0-9]{3,}$"

      source_limitation_ids:
        type: array
        uniqueItems: true
        description: >
          JEA limitation IDs from which this presentation limitation derives
          when applicable.
        items:
          type: string
          pattern: "^LIM-[0-9]{3,}$"

      source_evidence_need_ids:
        type: array
        uniqueItems: true
        description: >
          Material Evidence Need IDs associated with the limitation when
          relevant.
        items:
          type: string
          pattern: "^EN-[0-9]{3,}$"

      presentation_impact:
        type: string
        enum:
          - critical
          - high
          - moderate
          - low

      handling:
        type:
          - string
          - "null"
        description: >
          How the current presentation preserves factual integrity despite the
          limitation. This records current presentation state, not a request for
          corrective action.


  evidence_reference:
    type: object
    additionalProperties: false

    required:
      - jer_id
      - experience_point_ids
      - result_ids

    properties:

      jer_id:
        type: string
        pattern: "^JER-[0-9]{4,}$"

      experience_point_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^EP-[0-9]{4,}-[0-9]{2,}$"

      result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^RES-[0-9]{4,}-[0-9]{2,}$"


  partial_date:
    type: string
    description: >
      ISO-like date representation allowing year, year-month, or full date.
    pattern: "^[0-9]{4}(-[0-9]{2})?(-[0-9]{2})?$"


  lineage:
    type: object
    additionalProperties: false

    required:
      - created_at
      - updated_at

    properties:

      created_at:
        type: string
        format: date-time

      updated_at:
        type: string
        format: date-time

      supersedes_version:
        type:
          - integer
          - "null"
        minimum: 1

      material_change_summary:
        type:
          - string
          - "null"
        description: >
          Concise description of material semantic changes from the prior
          manifest version. This is intentionally not a detailed revision log.