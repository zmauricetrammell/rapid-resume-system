$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://rapid-resume-system.local/schemas/evidence-response.yaml"

title: "Evidence Response"
description: >
  Professional-state artifact representing factual results of human
  investigation against a defined Evidence Request.

type: object
additionalProperties: false

required:
  - schema_version
  - evidence_response_id
  - response_version
  - artifact_status
  - request_reference
  - investigation_status
  - objective_results
  - dimension_results
  - professional_episode_context
  - factual_findings
  - results
  - negative_evidence
  - contradictions
  - unresolved_dimensions
  - human_confirmation
  - source_context
  - lineage

properties:

  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"

  evidence_response_id:
    type: string
    pattern: "^ERESP-[0-9]{4,}$"

  response_version:
    type: integer
    minimum: 1

  artifact_status:
    type: string
    enum:
      - active
      - superseded
      - deprecated

  request_reference:
    $ref: "#/$defs/request_reference"

  investigation_status:
    $ref: "#/$defs/investigation_status"

  objective_results:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/objective_result"

  dimension_results:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/dimension_result"

  professional_episode_context:
    type: array
    items:
      $ref: "#/$defs/professional_episode_context"

  factual_findings:
    type: array
    items:
      $ref: "#/$defs/factual_finding"

  results:
    type: array
    items:
      $ref: "#/$defs/investigation_result"

  negative_evidence:
    type: array
    items:
      $ref: "#/$defs/negative_evidence"

  contradictions:
    type: array
    items:
      $ref: "#/$defs/contradiction"

  unresolved_dimensions:
    type: array
    items:
      $ref: "#/$defs/unresolved_dimension"

  human_confirmation:
    $ref: "#/$defs/human_confirmation"

  source_context:
    type: array
    items:
      $ref: "#/$defs/source_context"

  lineage:
    $ref: "#/$defs/lineage"

$defs:

  request_reference:
    type: object
    additionalProperties: false
    required:
      - evidence_request_id
      - evidence_request_version
    properties:

      evidence_request_id:
        type: string
        pattern: "^ERQ-[0-9]{4,}$"

      evidence_request_version:
        type: integer
        minimum: 1

      source_jea:
        oneOf:
          - $ref: "#/$defs/versioned_jea_reference"
          - type: "null"

      source_evidence_need_id:
        type: ["string", "null"]
        pattern: "^EN-[0-9]{3,}$"

  investigation_status:
    type: object
    additionalProperties: false
    required:
      - status
      - summary
    properties:
      status:
        type: string
        enum:
          - complete
          - partially_complete
          - unable_to_resolve
      summary:
        type: string
        minLength: 1
      completion_basis:
        type: ["string", "null"]

  objective_result:
    type: object
    additionalProperties: false
    required:
      - objective_id
      - status
      - finding_summary
      - factual_finding_ids
      - result_ids
      - negative_evidence_ids
    properties:

      objective_id:
        type: string
        pattern: "^OBJ-[0-9]{3,}$"

      status:
        type: string
        enum:
          - established
          - partially_established
          - not_established
          - unable_to_resolve

      finding_summary:
        type: string
        minLength: 1

      factual_finding_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^FIND-[0-9]{3,}$"

      result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ERES-[0-9]{3,}$"

      negative_evidence_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^NEG-[0-9]{3,}$"

      unresolved_reason:
        type: ["string", "null"]

  dimension_result:
    type: object
    additionalProperties: false
    required:
      - dimension
      - status
      - factual_finding_ids
      - result_ids
      - negative_evidence_ids
    properties:

      dimension:
        $ref: "#/$defs/evidence_dimension"

      status:
        type: string
        enum:
          - established
          - partially_established
          - not_established
          - unable_to_resolve
          - not_applicable

      factual_finding_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^FIND-[0-9]{3,}$"

      result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ERES-[0-9]{3,}$"

      negative_evidence_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^NEG-[0-9]{3,}$"

      notes:
        type: ["string", "null"]

  professional_episode_context:
    type: object
    additionalProperties: false
    required:
      - context_id
      - context_summary
    properties:

      context_id:
        type: string
        pattern: "^CTX-[0-9]{3,}$"

      jer_reference:
        oneOf:
          - $ref: "#/$defs/versioned_jer_reference"
          - type: "null"

      source_role_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ROLE-[0-9]{4,}$"

      experience_point_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^EP-[0-9]{4,}-[0-9]{2,}$"

      result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^RES-[0-9]{4,}-[0-9]{2,}$"

      context_summary:
        type: string
        minLength: 1

      source_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ECTX-[0-9]{3,}$"

  factual_finding:
    type: object
    additionalProperties: false
    required:
      - finding_id
      - finding_type
      - statement
      - factual_status
      - ownership
      - attribution
      - precision
      - scope
      - systems_tools
      - methods
      - related_objective_ids
      - related_dimensions
      - source_context_ids
      - qualifications
    properties:

      finding_id:
        type: string
        pattern: "^FIND-[0-9]{3,}$"

      finding_type:
        type: string
        enum:
          - responsibility
          - action
          - ownership
          - decision_authority
          - leadership
          - scope
          - system_tool
          - method
          - duration
          - frequency
          - proficiency
          - result_context
          - attribution
          - business_significance
          - operational_significance
          - customer_significance
          - contextual_fact
          - other

      statement:
        type: string
        minLength: 1

      factual_status:
        $ref: "#/$defs/factual_status"

      ownership:
        type: string
        enum:
          - direct
          - shared
          - contributory
          - support
          - unknown

      attribution:
        type: string
        enum:
          - individual
          - shared
          - contributory
          - organizational
          - unknown

      precision:
        $ref: "#/$defs/precision"

      scope:
        type: array
        items:
          $ref: "#/$defs/scope_item"

      systems_tools:
        type: array
        uniqueItems: true
        items:
          type: string

      methods:
        type: array
        uniqueItems: true
        items:
          type: string

      duration_frequency:
        oneOf:
          - $ref: "#/$defs/duration_frequency"
          - type: "null"

      related_objective_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^OBJ-[0-9]{3,}$"

      related_dimensions:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/evidence_dimension"

      related_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^CTX-[0-9]{3,}$"

      source_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ECTX-[0-9]{3,}$"

      qualifications:
        type: array
        items:
          type: string

      human_confirmation:
        type: ["string", "null"]
        enum:
          - confirmed
          - confirmed_with_qualification
          - not_individually_confirmed
          - null

  investigation_result:
    type: object
    additionalProperties: false
    required:
      - response_result_id
      - statement
      - result_type
      - attribution
      - factual_status
      - precision
      - related_finding_ids
      - related_objective_ids
      - source_context_ids
      - qualifications
    properties:

      response_result_id:
        type: string
        pattern: "^ERES-[0-9]{3,}$"

      statement:
        type: string
        minLength: 1

      result_type:
        type: string
        enum:
          - quantitative
          - qualitative
          - mixed
          - prevention
          - capability_created
          - delivery_completed
          - compliance_achieved
          - reliability_improved
          - cost_reduced
          - time_reduced
          - quality_improved
          - risk_reduced
          - adoption_increased
          - performance_improved
          - customer_outcome
          - organizational_outcome
          - other

      quantitative:
        oneOf:
          - $ref: "#/$defs/quantitative_result"
          - type: "null"

      qualitative:
        type: ["string", "null"]

      baseline:
        type: ["string", "number", "null"]

      final_state:
        type: ["string", "number", "null"]

      timeframe:
        type: ["string", "null"]

      attribution:
        type: string
        enum:
          - individual
          - shared
          - contributory
          - organizational
          - unknown

      factual_status:
        $ref: "#/$defs/factual_status"

      precision:
        $ref: "#/$defs/precision"

      related_finding_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^FIND-[0-9]{3,}$"

      related_objective_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^OBJ-[0-9]{3,}$"

      related_dimensions:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/evidence_dimension"

      source_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ECTX-[0-9]{3,}$"

      qualifications:
        type: array
        items:
          type: string

  negative_evidence:
    type: object
    additionalProperties: false
    required:
      - negative_evidence_id
      - statement
      - confidence
      - related_objective_ids
      - related_dimensions
      - source_context_ids
    properties:

      negative_evidence_id:
        type: string
        pattern: "^NEG-[0-9]{3,}$"

      statement:
        type: string
        minLength: 1

      confidence:
        type: string
        enum:
          - high
          - moderate
          - low

      related_objective_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^OBJ-[0-9]{3,}$"

      related_dimensions:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/evidence_dimension"

      related_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^CTX-[0-9]{3,}$"

      source_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ECTX-[0-9]{3,}$"

      qualification:
        type: ["string", "null"]

  contradiction:
    type: object
    additionalProperties: false
    required:
      - contradiction_id
      - description
      - prior_value
      - current_value
      - status
      - source_context_ids
    properties:

      contradiction_id:
        type: string
        pattern: "^CONTRA-[0-9]{3,}$"

      description:
        type: string
        minLength: 1

      prior_value:
        type: ["string", "number", "boolean"]

      current_value:
        type: ["string", "number", "boolean"]

      possible_explanation:
        type: ["string", "null"]

      status:
        type: string
        enum:
          - clarified
          - unresolved

      clarification:
        type: ["string", "null"]

      related_objective_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^OBJ-[0-9]{3,}$"

      related_dimensions:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/evidence_dimension"

      source_context_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ECTX-[0-9]{3,}$"

      unresolved_reason:
        type: ["string", "null"]

  unresolved_dimension:
    type: object
    additionalProperties: false
    required:
      - dimension
      - reason
      - related_objective_ids
    properties:

      dimension:
        $ref: "#/$defs/evidence_dimension"

      reason:
        type: string
        minLength: 1

      related_objective_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^OBJ-[0-9]{3,}$"

      attempted_clarification:
        type: ["string", "null"]

      residual_uncertainty:
        type: ["string", "null"]

  human_confirmation:
    type: object
    additionalProperties: false
    required:
      - status
      - confirmed_finding_ids
      - corrected_finding_ids
      - confirmed_result_ids
      - confirmed_negative_evidence_ids
    properties:

      status:
        type: string
        enum:
          - confirmed
          - confirmed_with_corrections
          - partially_confirmed
          - not_obtained

      confirmed_finding_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^FIND-[0-9]{3,}$"

      corrected_finding_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^FIND-[0-9]{3,}$"

      confirmed_result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^ERES-[0-9]{3,}$"

      confirmed_negative_evidence_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^NEG-[0-9]{3,}$"

      confirmation_summary:
        type: ["string", "null"]

      unconfirmed_material_items:
        type: array
        items:
          type: string

  source_context:
    type: object
    additionalProperties: false
    required:
      - source_context_id
      - source_type
    properties:

      source_context_id:
        type: string
        pattern: "^ECTX-[0-9]{3,}$"

      source_type:
        type: string
        enum:
          - human_statement
          - existing_evidence
          - supporting_document
          - prior_evidence_response
          - evidence_request_context
          - other

      reference:
        type: ["string", "null"]

      summary:
        type: ["string", "null"]

      notes:
        type: ["string", "null"]

  scope_item:
    type: object
    additionalProperties: false
    required:
      - dimension
      - value
      - precision
      - factual_status
    properties:

      dimension:
        type: string
        enum:
          - people
          - direct_reports
          - team_size
          - users
          - customers
          - sites
          - locations
          - countries
          - systems
          - applications
          - devices
          - endpoints
          - access_points
          - servers
          - network_nodes
          - vendors
          - projects
          - workstreams
          - budget
          - revenue
          - data_volume
          - transactions
          - incidents
          - assets
          - facilities
          - duration
          - frequency
          - geographic_scope
          - organizational_scope
          - other

      value:
        type: ["string", "number"]

      unit:
        type: ["string", "null"]

      precision:
        $ref: "#/$defs/precision"

      factual_status:
        $ref: "#/$defs/factual_status"

      qualification:
        type: ["string", "null"]

  duration_frequency:
    type: object
    additionalProperties: false
    properties:
      duration:
        type: ["string", "null"]
      frequency:
        type: ["string", "null"]
      recurring:
        type: ["boolean", "null"]
      precision:
        oneOf:
          - $ref: "#/$defs/precision"
          - type: "null"

  quantitative_result:
    type: object
    additionalProperties: false
    properties:
      value:
        type: ["number", "null"]
      minimum:
        type: ["number", "null"]
      maximum:
        type: ["number", "null"]
      unit:
        type: ["string", "null"]
      precision:
        $ref: "#/$defs/precision"
      comparison:
        type: ["string", "null"]

  factual_status:
    type: string
    enum:
      - confirmed
      - current_recollection
      - estimated
      - qualified
      - uncertain

  precision:
    type: string
    enum:
      - exact
      - approximate
      - range
      - minimum
      - maximum
      - order_of_magnitude
      - qualitative
      - unknown

  evidence_dimension:
    type: string
    enum:
      - responsibility
      - action
      - ownership
      - decision_authority
      - leadership
      - scope
      - organizational_scope
      - user_customer_scope
      - geographic_scope
      - budget
      - systems
      - tools
      - complexity
      - duration
      - frequency
      - proficiency
      - result
      - baseline
      - final_state
      - attribution
      - business_significance
      - operational_significance
      - customer_significance
      - verification
      - conflicting_value
      - directness
      - other

  versioned_jer_reference:
    type: object
    additionalProperties: false
    required:
      - jer_id
      - jer_version
    properties:
      jer_id:
        type: string
        pattern: "^JER-[0-9]{4,}$"
      jer_version:
        type: integer
        minimum: 1

  versioned_jea_reference:
    type: object
    additionalProperties: false
    required:
      - jea_id
      - analysis_version
    properties:
      jea_id:
        type: string
        pattern: "^JEA-[0-9]{4,}$"
      analysis_version:
        type: integer
        minimum: 1

  lineage:
    type: object
    additionalProperties: false
    required:
      - created_at
      - updated_at
    properties:
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      supersedes_version:
        type: ["integer", "null"]
        minimum: 1
      material_change_summary:
        type: ["string", "null"]