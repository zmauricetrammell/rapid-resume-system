$schema: https://json-schema.org/draft/2020-12/schema
$id: https://rapid-resume-system.local/schemas/job-experience-record.yaml
title: Job Experience Record
description: 'Authoritative reusable professional evidence record representing one coherent professional
  episode. A Job Experience Record preserves factual provenance, individually addressable professional
  evidence, results, attribution, uncertainty, source relationships, and reusable non-target-specific
  classifications.

  '
type: object
additionalProperties: false
required:
- schema_version
- jer_id
- record_version
- status
- provenance
- episode
- experience_points
- results
- classifications
- unresolved_conflicts
- known_unknowns
- source_references
- lineage
properties:
  schema_version:
    type: string
    pattern: ^[0-9]+\.[0-9]+$
    examples:
    - '2.0'
  jer_id:
    type: string
    pattern: ^JER-[0-9]{4,}$
  record_version:
    type: integer
    minimum: 1
  status:
    type: string
    enum:
    - active
    - superseded
    - merged
    - split
    - deprecated
  provenance:
    $ref: '#/$defs/provenance'
  episode:
    $ref: '#/$defs/professional_episode'
  experience_points:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/experience_point'
  results:
    type: array
    items:
      $ref: '#/$defs/result'
  classifications:
    $ref: '#/$defs/classifications'
  unresolved_conflicts:
    type: array
    items:
      $ref: '#/$defs/evidence_conflict'
  known_unknowns:
    type: array
    items:
      $ref: '#/$defs/known_unknown'
  source_references:
    type: array
    items:
      $ref: '#/$defs/source_reference'
  lineage:
    $ref: '#/$defs/lineage'
$defs:
  provenance:
    type: object
    additionalProperties: false
    required:
    - employer
    - overall_start_date
    - overall_end_date
    - source_roles
    properties:
      employer:
        type: string
        minLength: 1
      employment_type:
        type:
        - string
        - 'null'
        enum:
        - full_time
        - part_time
        - contract
        - consulting
        - internship
        - military
        - volunteer
        - self_employed
        - other
        - null
      location:
        type:
        - string
        - 'null'
      overall_start_date:
        $ref: '#/$defs/partial_date'
      overall_end_date:
        oneOf:
        - $ref: '#/$defs/partial_date'
        - type: string
          const: present
      source_roles:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/source_role'
  source_role:
    type: object
    additionalProperties: false
    required:
    - source_role_id
    - title
    properties:
      source_role_id:
        type: string
        pattern: ^ROLE-[0-9]{4,}$
      title:
        type: string
        minLength: 1
      organization:
        type:
        - string
        - 'null'
      start_date:
        oneOf:
        - $ref: '#/$defs/partial_date'
        - type: 'null'
      end_date:
        oneOf:
        - $ref: '#/$defs/partial_date'
        - type: string
          const: present
        - type: 'null'
      notes:
        type:
        - string
        - 'null'
  professional_episode:
    type: object
    additionalProperties: false
    required:
    - title
    - summary
    properties:
      title:
        type: string
        minLength: 1
      summary:
        type: string
        minLength: 1
      start_date:
        oneOf:
        - $ref: '#/$defs/partial_date'
        - type: 'null'
      end_date:
        oneOf:
        - $ref: '#/$defs/partial_date'
        - type: string
          const: present
        - type: 'null'
      context:
        type:
        - string
        - 'null'
      environment:
        type:
        - string
        - 'null'
      stakeholders:
        type: array
        uniqueItems: true
        items:
          type: string
  experience_point:
    type: object
    additionalProperties: false
    required:
    - experience_point_id
    - statement
    - evidence_type
    - factual_status
    - ownership
    - attribution
    - source_refs
    - related_result_ids
    properties:
      experience_point_id:
        type: string
        pattern: ^EP-[0-9]{4,}-[0-9]{2,}$
      statement:
        type: string
        minLength: 1
      evidence_type:
        type: string
        enum:
        - responsibility
        - action
        - decision
        - ownership
        - leadership
        - technical_execution
        - operational_execution
        - project_delivery
        - process_improvement
        - governance
        - stakeholder_management
        - vendor_management
        - people_management
        - risk_management
        - compliance
        - architecture
        - implementation
        - troubleshooting
        - automation
        - training
        - other
      responsibility:
        type:
        - string
        - 'null'
      actions:
        type: array
        items:
          type: string
      ownership:
        type: string
        enum:
        - direct
        - shared
        - contributory
        - support
        - unknown
      decision_authority:
        type:
        - string
        - 'null'
      scope:
        type: array
        items:
          $ref: '#/$defs/scope_item'
      systems_tools:
        type: array
        uniqueItems: true
        items:
          type: string
      methods:
        type: array
        uniqueItems: true
        items:
          type: string
      duration_frequency:
        oneOf:
        - $ref: '#/$defs/duration_frequency'
        - type: 'null'
      attribution:
        type: string
        enum:
        - individual
        - shared
        - contributory
        - organizational
        - unknown
      factual_status:
        $ref: '#/$defs/factual_status'
      confidence:
        type:
        - string
        - 'null'
        enum:
        - high
        - medium
        - low
        - null
      qualifications:
        type: array
        items:
          type: string
      source_refs:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^SRC-[0-9]{4,}-[0-9]{2,}$
      related_result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^RES-[0-9]{4,}-[0-9]{2,}$
  result:
    type: object
    additionalProperties: false
    required:
    - result_id
    - statement
    - result_type
    - attribution
    - factual_status
    - related_experience_point_ids
    - source_refs
    properties:
      result_id:
        type: string
        pattern: ^RES-[0-9]{4,}-[0-9]{2,}$
      statement:
        type: string
        minLength: 1
      result_type:
        type: string
        enum:
        - quantitative
        - qualitative
        - mixed
        - prevention
        - capability_created
        - delivery_completed
        - compliance_achieved
        - reliability_improved
        - cost_reduced
        - time_reduced
        - quality_improved
        - risk_reduced
        - adoption_increased
        - performance_improved
        - customer_outcome
        - organizational_outcome
        - other
      quantitative:
        oneOf:
        - $ref: '#/$defs/quantitative_result'
        - type: 'null'
      qualitative:
        type:
        - string
        - 'null'
      baseline:
        type:
        - string
        - number
        - 'null'
      final_state:
        type:
        - string
        - number
        - 'null'
      timeframe:
        type:
        - string
        - 'null'
      attribution:
        type: string
        enum:
        - individual
        - shared
        - contributory
        - organizational
        - unknown
      related_experience_point_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: ^EP-[0-9]{4,}-[0-9]{2,}$
      factual_status:
        $ref: '#/$defs/factual_status'
      qualifications:
        type: array
        items:
          type: string
      source_refs:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^SRC-[0-9]{4,}-[0-9]{2,}$
  quantitative_result:
    type: object
    additionalProperties: false
    properties:
      value:
        type:
        - number
        - 'null'
      minimum:
        type:
        - number
        - 'null'
      maximum:
        type:
        - number
        - 'null'
      unit:
        type:
        - string
        - 'null'
      precision:
        oneOf:
        - $ref: '#/$defs/precision'
        - type: 'null'
      comparison:
        type:
        - string
        - 'null'
  scope_item:
    type: object
    additionalProperties: false
    required:
    - dimension
    - value
    - factual_status
    properties:
      dimension:
        type: string
        enum:
        - people
        - direct_reports
        - team_size
        - users
        - customers
        - sites
        - locations
        - countries
        - systems
        - applications
        - devices
        - endpoints
        - access_points
        - servers
        - network_nodes
        - vendors
        - projects
        - workstreams
        - budget
        - revenue
        - data_volume
        - transactions
        - incidents
        - assets
        - facilities
        - duration
        - frequency
        - geographic_scope
        - organizational_scope
        - other
      value:
        type:
        - string
        - number
      unit:
        type:
        - string
        - 'null'
      precision:
        oneOf:
        - $ref: '#/$defs/precision'
        - type: 'null'
      factual_status:
        $ref: '#/$defs/factual_status'
      qualification:
        type:
        - string
        - 'null'
  duration_frequency:
    type: object
    additionalProperties: false
    properties:
      duration:
        type:
        - string
        - 'null'
      frequency:
        type:
        - string
        - 'null'
      recurring:
        type:
        - boolean
        - 'null'
      precision:
        oneOf:
        - $ref: '#/$defs/precision'
        - type: 'null'
  precision:
    type: string
    enum:
    - exact
    - approximate
    - range
    - minimum
    - maximum
    - order_of_magnitude
    - qualitative
    - unknown
  classifications:
    type: object
    additionalProperties: false
    required:
    - capabilities
    - functional_roles
    - technical_domains
    - management_domains
    - industries
    properties:
      capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
      functional_roles:
        type: array
        uniqueItems: true
        items:
          type: string
      technical_domains:
        type: array
        uniqueItems: true
        items:
          type: string
      management_domains:
        type: array
        uniqueItems: true
        items:
          type: string
      industries:
        type: array
        uniqueItems: true
        items:
          type: string
  evidence_conflict:
    type: object
    additionalProperties: false
    required:
    - conflict_id
    - description
    - conflicting_values
    - status
    properties:
      conflict_id:
        type: string
        pattern: ^CONFLICT-[0-9]{4,}-[0-9]{2,}$
      description:
        type: string
        minLength: 1
      related_experience_point_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^EP-[0-9]{4,}-[0-9]{2,}$
      related_result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^RES-[0-9]{4,}-[0-9]{2,}$
      conflicting_values:
        type: array
        minItems: 2
        items:
          type: object
          additionalProperties: false
          required:
          - value
          - source_refs
          properties:
            value:
              type:
              - string
              - number
              - boolean
            source_refs:
              type: array
              uniqueItems: true
              items:
                type: string
                pattern: ^SRC-[0-9]{4,}-[0-9]{2,}$
            qualification:
              type:
              - string
              - 'null'
      possible_explanations:
        type: array
        items:
          type: string
      status:
        type: string
        enum:
        - unresolved
        - partially_resolved
        - resolved
      resolution:
        type:
        - string
        - 'null'
      resolution_source_refs:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^SRC-[0-9]{4,}-[0-9]{2,}$
  known_unknown:
    type: object
    additionalProperties: false
    required:
    - unknown_id
    - description
    - materiality
    properties:
      unknown_id:
        type: string
        pattern: ^UNK-[0-9]{4,}-[0-9]{2,}$
      description:
        type: string
        minLength: 1
      related_experience_point_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^EP-[0-9]{4,}-[0-9]{2,}$
      related_result_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^RES-[0-9]{4,}-[0-9]{2,}$
      materiality:
        type: string
        enum:
        - high
        - moderate
        - low
      notes:
        type:
        - string
        - 'null'
  source_reference:
    type: object
    additionalProperties: false
    required:
    - source_id
    - source_type
    - title
    properties:
      source_id:
        type: string
        pattern: ^SRC-[0-9]{4,}-[0-9]{2,}$
      source_type:
        type: string
        enum:
        - resume
        - performance_evaluation
        - award
        - project_document
        - technical_document
        - report
        - presentation
        - email
        - interview
        - evidence_response
        - certificate
        - academic_record
        - employment_record
        - human_confirmation
        - external_record
        - other
      title:
        type: string
        minLength: 1
      date:
        oneOf:
        - $ref: '#/$defs/partial_date'
        - type: 'null'
      locator:
        type:
        - string
        - 'null'
      notes:
        type:
        - string
        - 'null'
      evidentiary_role:
        type:
        - string
        - 'null'
        enum:
        - confirms
        - supports
        - contextualizes
        - qualifies
        - contradicts
        - source_only
        - null
  lineage:
    type: object
    additionalProperties: false
    required:
    - created_at
    - updated_at
    - merge_sources
    - split_sources
    properties:
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      supersedes_version:
        type:
        - integer
        - 'null'
        minimum: 1
      merge_sources:
        type: array
        uniqueItems: true
        description: Exact versioned Job Experience Records merged into this record when applicable.
        items:
          $ref: '#/$defs/versioned_jer_reference'
      split_sources:
        type: array
        uniqueItems: true
        description: Exact versioned Job Experience Records from which this record was split when applicable.
        items:
          $ref: '#/$defs/versioned_jer_reference'
      change_summary:
        type:
        - string
        - 'null'
  factual_status:
    type: string
    enum:
    - confirmed
    - externally_supported
    - current_recollection
    - estimated
    - qualified
    - conflicting
    - unknown
  partial_date:
    type: string
    pattern: ^[0-9]{4}(-[0-9]{2})?(-[0-9]{2})?$
  versioned_jer_reference:
    type: object
    additionalProperties: false
    required:
    - jer_id
    - jer_version
    properties:
      jer_id:
        type: string
        pattern: ^JER-[0-9]{4,}$
      jer_version:
        type: integer
        minimum: 1